name: Build PumpSaathi Android APK from PWA

on:
  workflow_dispatch:
    inputs:
      pwa_manifest_url:
        description: 'Live PWA manifest.json URL'
        required: true
        default: 'https://digitalpetroleumin-app.github.io/Pumpsaathi/manifest.json'
      app_name:
        description: 'Android App Name'
        required: true
        default: 'PumpSaathi'
      package_id:
        description: 'Android Package ID'
        required: true
        default: 'shop.digitalpetroleum.pumpsaathi'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & Bubblewrap Config
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          if [ ! -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null 2>&1
          
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          
          npm install -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF
          cat ~/.bubblewrap/config.json

      - name: Ensure 512x512 App Icon Exists Locally
        run: |
          python3 -c '
          import os, zlib, struct
          from PIL import Image
          ' 2>/dev/null || pip install Pillow --quiet
          python3 -c '
          import os
          from PIL import Image
          if os.path.exists("icon-512.png"):
              img = Image.open("icon-512.png").convert("RGBA").resize((512, 512))
              img.save("icon-512.png", "PNG")
          elif os.path.exists("logo.png"):
              img = Image.open("logo.png").convert("RGBA").resize((512, 512))
              img.save("icon-512.png", "PNG")
          else:
              img = Image.new("RGBA", (512, 512), (11, 61, 145, 255))
              img.save("icon-512.png", "PNG")
          '

      - name: Generate Keystore if not present
        run: |
          if [ ! -f android.keystore ]; then
            keytool -genkeypair -v -keystore android.keystore -alias pumpsaathi \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass Pumpsaathi@2026 -keypass Pumpsaathi@2026 \
              -dname "CN=Rohit Dev, OU=Digital Petroleum, O=Digital Petroleum, L=Almora, ST=Uttarakhand, C=IN"
          fi

      - name: Initialize & Build TWA APK via Bubblewrap
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: Pumpsaathi@2026
          BUBBLEWRAP_KEY_PASSWORD: Pumpsaathi@2026
        run: |
          python3 -m http.server 8765 &
          SERVER_PID=$!
          sleep 2
          mkdir -p twa-build && cd twa-build
          cat <<EOF > twa-manifest.json
          {
            "packageId": "${{ github.event.inputs.package_id || 'shop.digitalpetroleum.pumpsaathi' }}",
            "host": "digitalpetroleumin-app.github.io",
            "name": "${{ github.event.inputs.app_name || 'PumpSaathi' }}",
            "launcherName": "${{ github.event.inputs.app_name || 'PumpSaathi' }}",
            "display": "standalone",
            "themeColor": "#0b3d91",
            "navigationColor": "#040b19",
            "navigationColorDark": "#040b19",
            "navigationDividerColor": "#040b19",
            "navigationDividerColorDark": "#040b19",
            "backgroundColor": "#040b19",
            "enableNotifications": true,
            "startUrl": "/Pumpsaathi/index.html",
            "iconUrl": "http://127.0.0.1:8765/icon-512.png",
            "maskableIconUrl": "http://127.0.0.1:8765/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "$GITHUB_WORKSPACE/android.keystore",
              "alias": "pumpsaathi"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "${{ github.event.inputs.pwa_manifest_url || 'https://digitalpetroleumin-app.github.io/Pumpsaathi/manifest.json' }}",
            "fallbackType": "customtabs",
            "features": {
              "locationDelegation": {
                "enabled": true
              }
            },
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://digitalpetroleumin-app.github.io/Pumpsaathi/",
            "minSdkVersion": 21,
            "orientation": "portrait"
          }
          EOF
          
          # Re-verify ~/.bubblewrap/config.json right before running bubblewrap
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          
          bubblewrap update --appVersionName="1.0.0" --skipVersionUpgrade
          bubblewrap build --skipPwaValidation
          kill $SERVER_PID || true

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PumpSaathi-Release-APK
          path: |
            twa-build/app-release-signed.apk
            twa-build/*signed.apk
