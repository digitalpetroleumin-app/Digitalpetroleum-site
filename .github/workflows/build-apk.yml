name: Build PumpSaathi Android APK from PWA

on:
  workflow_dispatch:
    inputs:
      pwa_manifest_url:
        description: 'Live PWA manifest.json URL'
        required: true
        default: 'https://digitalpetroleumin-app.github.io/Pumpsaathi/manifest.json'
      app_name:
        description: 'Android App Name'
        required: true
        default: 'PumpSaathi'
      package_id:
        description: 'Android Package ID'
        required: true
        default: 'shop.digitalpetroleum.pumpsaathi'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & All Required Platforms
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"
          mkdir -p "$ANDROID_SDK_ROOT/platform-tools"
          
          if [ ! -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" > /dev/null 2>&1
          
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          
          npm install -g @bubblewrap/cli
          
          mkdir -p ~/.bubblewrap
          mkdir -p ~/.config/@bubblewrap/cli
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF
          cp ~/.bubblewrap/config.json ~/.config/@bubblewrap/cli/config.json

      - name: Generate Valid 512x512 PNG Icons
        run: |
          pip install Pillow --quiet
          python3 -c '
          import os
          from PIL import Image
          bg = Image.new("RGBA", (512, 512), (11, 61, 145, 255))
          src_path = "icon-512.png" if os.path.exists("icon-512.png") else ("logo.png" if os.path.exists("logo.png") else None)
          if src_path:
              try:
                  fg = Image.open(src_path).convert("RGBA").resize((512, 512))
                  bg = Image.alpha_composite(bg, fg)
              except Exception:
                  pass
          bg.convert("RGB").save("icon-512-clean.png", "PNG")
          '

      - name: Generate Keystore if not present
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/android.keystore" ]; then
            keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/android.keystore" -alias pumpsaathi \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass Pumpsaathi@2026 -keypass Pumpsaathi@2026 \
              -dname "CN=Rohit Dev, OU=Digital Petroleum, O=Digital Petroleum, L=Almora, ST=Uttarakhand, C=IN"
          fi

      - name: Initialize & Build TWA APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: Pumpsaathi@2026
          BUBBLEWRAP_KEY_PASSWORD: Pumpsaathi@2026
        run: |
          python3 -m http.server 8765 &
          SERVER_PID=$!
          sleep 2
          
          rm -rf twa-build
          mkdir -p twa-build && cd twa-build
          
          cat <<EOF > twa-manifest.json
          {
            "packageId": "${{ github.event.inputs.package_id || 'shop.digitalpetroleum.pumpsaathi' }}",
            "host": "digitalpetroleumin-app.github.io",
            "name": "${{ github.event.inputs.app_name || 'PumpSaathi' }}",
            "launcherName": "${{ github.event.inputs.app_name || 'PumpSaathi' }}",
            "display": "standalone",
            "themeColor": "#0b3d91",
            "navigationColor": "#040b19",
            "navigationColorDark": "#040b19",
            "navigationDividerColor": "#040b19",
            "navigationDividerColorDark": "#040b19",
            "backgroundColor": "#040b19",
            "enableNotifications": true,
            "startUrl": "/Pumpsaathi/index.html",
            "iconUrl": "http://127.0.0.1:8765/icon-512-clean.png",
            "maskableIconUrl": "http://127.0.0.1:8765/icon-512-clean.png",
            "monochromeIconUrl": "http://127.0.0.1:8765/icon-512-clean.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "$GITHUB_WORKSPACE/android.keystore",
              "alias": "pumpsaathi"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "${{ github.event.inputs.pwa_manifest_url || 'https://digitalpetroleumin-app.github.io/Pumpsaathi/manifest.json' }}",
            "fallbackType": "customtabs",
            "features": {
              "locationDelegation": {
                "enabled": true
              }
            },
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://digitalpetroleumin-app.github.io/Pumpsaathi/",
            "minSdkVersion": 24,
            "orientation": "portrait"
          }
          EOF
          
          # 1. Generate Android Project via Bubblewrap
          bubblewrap update --appVersionName="1.0.0" --skipVersionUpgrade
          
          # 2. Force minSdkVersion 24 in app/build.gradle just in case
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' app/build.gradle
          
          # 3. Configure Gradle for Java 17 compatibility & SDK path
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat <<EOF >> gradle.properties
          
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
          android.useAndroidX=true
          EOF
          
          chmod +x ./gradlew
          
          # 4. Build Release APK
          ./gradlew assembleRelease --no-daemon --stacktrace
          
          # 5. Align and Sign APK
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          
          "$BUILD_TOOLS_DIR/zipalign" -f -v -p 4 "$UNSIGNED_APK" app-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/android.keystore" \
            --ks-key-alias pumpsaathi \
            --ks-pass pass:Pumpsaathi@2026 \
            --key-pass pass:Pumpsaathi@2026 \
            --out app-release-signed.apk \
            app-release-aligned.apk
            
          ls -lh app-release-signed.apk
          kill $SERVER_PID || true

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PumpSaathi-Release-APK
          path: twa-build/app-release-signed.apk
