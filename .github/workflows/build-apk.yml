name: Build PumpSaathi Android APK from PWA

on:
  workflow_dispatch:
    inputs:
      pwa_manifest_url:
        description: 'Live PWA manifest.json URL'
        required: true
        default: 'https://digitalpetroleumin-app.github.io/Pumpsaathi/manifest.json'
      app_name:
        description: 'Android App Name'
        required: true
        default: 'PumpSaathi'
      package_id:
        description: 'Android Package ID'
        required: true
        default: 'shop.digitalpetroleum.pumpsaathi'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Clean Android SDK & Accept Licenses
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null 2>&1
          
          npm install -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Ensure 512x512 App Icon Exists Locally
        run: |
          python3 -c '
          import os, zlib, struct, shutil
          if not os.path.exists("icon-512.png"):
              if os.path.exists("logo.png"):
                  shutil.copy("logo.png", "icon-512.png")
              else:
                  w, h = 512, 512
                  raw = b"".join(b"\x00" + b"\x0b\x3d\x91\xff" * w for _ in range(h))
                  def chunk(t, d):
                      return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
                  png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
                  open("icon-512.png", "wb").write(png)
          '

      - name: Generate Keystore if not present
        run: |
          if [ ! -f android.keystore ]; then
            keytool -genkeypair -v -keystore android.keystore -alias pumpsaathi \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass Pumpsaathi@2026 -keypass Pumpsaathi@2026 \
              -dname "CN=Rohit Dev, OU=Digital Petroleum, O=Digital Petroleum, L=Almora, ST=Uttarakhand, C=IN"
          fi

      - name: Initialize & Build TWA APK via Bubblewrap
        run: |
          python3 -m http.server 8765 &
          SERVER_PID=$!
          sleep 2
          mkdir -p twa-build && cd twa-build
          cat <<EOF > twa-manifest.json
          {
            "packageId": "${{ github.event.inputs.package_id }}",
            "host": "digitalpetroleumin-app.github.io",
            "name": "${{ github.event.inputs.app_name }}",
            "launcherName": "${{ github.event.inputs.app_name }}",
            "display": "standalone",
            "themeColor": "#0b3d91",
            "navigationColor": "#040b19",
            "navigationColorDark": "#040b19",
            "navigationDividerColor": "#040b19",
            "navigationDividerColorDark": "#040b19",
            "backgroundColor": "#040b19",
            "enableNotifications": true,
            "startUrl": "/Pumpsaathi/index.html",
            "iconUrl": "http://127.0.0.1:8765/icon-512.png",
            "maskableIconUrl": "http://127.0.0.1:8765/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "../android.keystore",
              "alias": "pumpsaathi"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "${{ github.event.inputs.pwa_manifest_url }}",
            "fallbackType": "customtabs",
            "features": {
              "locationDelegation": {
                "enabled": true
              }
            },
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://digitalpetroleumin-app.github.io/Pumpsaathi/",
            "minSdkVersion": 21,
            "orientation": "portrait"
          }
          EOF
          yes "" | bubblewrap update --appVersionName="1.0.0" --skipPwaValidation
          export BUBBLEWRAP_KEYSTORE_PASSWORD=Pumpsaathi@2026
          export BUBBLEWRAP_KEY_PASSWORD=Pumpsaathi@2026
          export ANDROID_HOME="$HOME/android-sdk"
          bubblewrap build --skipPwaValidation
          kill $SERVER_PID || true

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PumpSaathi-Release-APK
          path: twa-build/app-release-signed.apk
